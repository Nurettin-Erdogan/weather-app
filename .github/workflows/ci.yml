name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Start static server
        run: |
          python -m http.server 8000 --bind 127.0.0.1 > /tmp/weather-app-server.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/weather-app-server.log
          exit 1
      - name: Run data and browser tests
        env:
          CI: true
          APP_BASE_URL: http://127.0.0.1:8000
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
      - name: Validate release package
        run: python scripts/build_release.py
